services:
  db:
    image: postgres:16-alpine
    container_name: tender-db
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tender
    ports:
      - "5433:5432"
    volumes:
      - tender-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tender-pgdata:
